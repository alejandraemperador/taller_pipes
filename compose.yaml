services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: inventory_practice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_practice"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - inventory_data:/var/lib/postgresql/data

volumes:
  inventory_data:
